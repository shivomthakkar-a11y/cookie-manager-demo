  <!-- HubSpot forms loader, kept for the pre-consent tag tests (PRI-89). The
       form itself is not created: it injects <style> tags without our nonce,
       the strict CSP blocks them and the form throws styled-components #17. -->

  <!-- Test vendors (PRI-89). Real third-party tags so the scanner and the
       banner have cookies to find. Keep them below the banner tag, and add new
       hosts to the VENDOR_* lists in vite.config.js or the CSP blocks them. -->
  <section id="privy-test-vendors" class="test-vendors">
    <h2>Test vendors</h2>
    <div class="test-vendor-grid">
      <div class="test-vendor">
        <h3>Google Maps (iframe)</h3>
        <iframe src="https://www.google.com/maps?q=Mumbai&amp;output=embed" width="400" height="300"
          title="Google Maps" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="test-vendor">
        <h3>YouTube privacy mode (iframe)</h3>
        <iframe src="https://www.youtube-nocookie.com/embed/HjhbJKK5OJU" width="400" height="225"
          title="YouTube privacy mode" referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
      <div class="test-vendor">
        <h3>Facebook Page plugin (iframe)</h3>
        <iframe
          src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Ffacebook&amp;tabs=timeline&amp;width=340&amp;height=400&amp;small_header=true&amp;hide_cover=false&amp;show_facepile=false"
          width="340" height="400" title="Facebook Page plugin" scrolling="no"
          allow="encrypted-media; clipboard-write; picture-in-picture; web-share"></iframe>
      </div>
      <div class="test-vendor">
        <h3>X share button (script)</h3>
        <a href="https://twitter.com/share?ref_src=twsrc%5Etfw" class="twitter-share-button"
          data-show-count="false">Post</a>
      </div>
      <div class="test-vendor">
        <h3>reCAPTCHA (never-block marker)</h3>
        <!-- Google's public test site key: always passes and is not a secret. -->
        <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
      </div>
      <div class="test-vendor">
        <h3>Google ad slot (script + iframes)</h3>
        <div id="div-gpt-ad-test" class="test-vendor-ad"></div>
      </div>
    </div>
  </section>
